# Site-instellingen voor De Gouden Schaar (Jekyll / GitHub Pages)
title: De Gouden Schaar
description: Fournituren en modeaccessoires in Ledeberg, sinds 1910. Garen, ritsen, knopen, linten, voering en naaiwerk op maat.
lang: nl-BE
# Vul hier het volledige webadres in zodra het domein gekoppeld is, bv. https://www.degoudenschaar.info
url: "https://sander-sdv.github.io"
baseurl: "/De-Gouden-Schaar"

# Bewerkmodus (/bewerken/): hier slaat de editor de wijzigingen op.
cms:
  repo: sander-sdv/De-Gouden-Schaar
  branch: main

markdown: kramdown
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - tools
  - .gitattributes
