{% assign w = site.data.winkel %}
<footer class="site-footer">
  <div class="wrap">
    <span>© {{ site.time | date: "%Y" }} <span data-cms="winkel:naam">{{ w.naam }}</span> · <span data-cms="winkel:adres.straat">{{ w.adres.straat }}</span>, <span data-cms="winkel:adres.postcode">{{ w.adres.postcode }}</span> <span data-cms="winkel:adres.gemeente">{{ w.adres.gemeente }}</span></span>
    <span class="social">{% for s in w.sociaal %}<a href="{{ s.url }}" target="_blank" rel="noopener">{{ s.naam }}</a>{% endfor %}</span>
  </div>
</footer>
