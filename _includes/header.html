{% assign w = site.data.winkel %}
<header class="site-header">
  <div class="wrap nav">
    <a class="brand" href="{{ '/' | relative_url }}">{% include scissors.html size=24 %}<span data-cms="winkel:naam">{{ w.naam }}</span></a>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="hoofdmenu"><span class="menu-icon" aria-hidden="true"><i></i><i></i><i></i></span><span class="menu-label">Menu</span></button>
    <nav id="hoofdmenu" aria-label="Hoofdmenu">
      <a href="{{ "/" | relative_url }}#aanbod">Aanbod</a>
      <a href="{{ "/" | relative_url }}#diensten">Diensten</a>
      <a href="{{ "/" | relative_url }}#over-ons">Over ons</a>
      <a href="{{ "/" | relative_url }}#contact">Contact</a>
    </nav>
  </div>
  <div class="tape" aria-hidden="true">{% for i in (0..29) %}<span style="left:{{ i | times: 100 }}px">{{ i }}</span>{% endfor %}</div>
</header>
{% if w.mededeling.tonen or page.cms %}
<div class="notice" role="status" data-cms-toggle="winkel:mededeling.tonen"{% unless w.mededeling.tonen %} hidden{% endunless %}><div class="wrap" data-cms="winkel:mededeling.tekst">{{ w.mededeling.tekst }}</div></div>
{% endif %}
