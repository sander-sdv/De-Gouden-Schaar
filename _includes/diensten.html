{% assign d = site.data.diensten %}
<section class="section band" id="diensten">
  <div class="wrap">
    <div class="bandhead"><h2>{{ d.titel }}</h2><span>{{ d.ondertitel }}</span></div>
    <div class="svc">
      {% for s in d.items %}
      <div><h3>{{ s.titel }}</h3><p>{{ s.tekst }}</p></div>
      {% endfor %}
    </div>
  </div>
</section>
