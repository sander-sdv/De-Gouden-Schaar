citaat: Opgegroeid tussen de knopen en de linten. De passie voor het vak gaat hier van moeder op dochter.
tekst: >-
  Rond 1910 startte de overgrootmoeder de zaak, in 1920 verhuisde ze naar de
  Ledebergstraat 4. De huidige uitbaatster studeerde snit en naad, volgde twee jaar
  specialisatie en nam in 1988 over.
