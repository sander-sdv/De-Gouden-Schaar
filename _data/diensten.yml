titel: Wij naaien ook voor jou
ondertitel: In het atelier achter de winkel
items:
  - titel: Inleggen
    tekst: "Broeken, rokken en kleedjes op maat, met de hand of met de machine."
  - titel: Ritsen insteken
    tekst: "Een kapotte rits in je rok of broek? Wij steken er een nieuwe in."
  - titel: Naaibenodigdheden
    tekst: "Een grote knopencollectie, Fiskars-stofscharen, het Gold-Zack-gamma, kniestukken en klittenband in alle kleuren."
