<!doctype html>
<html lang="{{ site.lang | default: 'nl' }}">
<head>
  <meta charset="utf-8">
  <script>document.documentElement.classList.add('js')</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  {% if page.cms %}<meta name="robots" content="noindex, nofollow">
  {% endif %}<meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ '/assets/images/knopen.jpg' | absolute_url }}">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% assign w = site.data.winkel %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Store",
    "name": {{ w.naam | jsonify }},
    "description": {{ site.description | jsonify }},
    "telephone": {{ w.telefoon | jsonify }},
    "email": {{ w.email | jsonify }},
    "foundingDate": "1910",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": {{ w.adres.straat | jsonify }},
      "postalCode": {{ w.adres.postcode | jsonify }},
      "addressLocality": {{ w.adres.gemeente | jsonify }},
      "addressCountry": "BE"
    }
  }
  </script>
</head>
<body>
  <a class="skip" href="#inhoud">Naar de inhoud</a>
  {% include header.html %}
  <main id="inhoud">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  {% if page.cms %}
  <link rel="stylesheet" href="{{ '/assets/cms/cms.css' | relative_url }}">
  <script type="module" src="{{ '/assets/cms/cms.js' | relative_url }}" id="cms-script" data-repo="{{ site.cms.repo }}" data-branch="{{ site.cms.branch }}" data-home="{{ '/' | relative_url }}"></script>
  {% endif %}
</body>
</html>
